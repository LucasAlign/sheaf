kind = "web"
previewPath = "/"
title = "Bridge"
description = "A community-of-care app that helps caseworkers post verified needs and lets volunteers find, claim, and follow through on ways to help local families."
version = "1.0.0"
id = "artifacts/bridge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20043

[services.development]
run = "pnpm --filter @workspace/bridge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bridge", "run", "build" ]
serve = "static"
publicDir = "artifacts/bridge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20043"
BASE_PATH = "/"
